<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111015"><title>Riftbound — Dungeon Run</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111015;color:#eee;font:14px system-ui;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#hud{position:fixed;inset:0;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 4px #000}.panel{background:#17141be8;border:1px solid #796453;border-radius:7px;padding:9px 12px;min-width:150px}.brand{font-weight:900;letter-spacing:3px;color:#d9b88e}.muted{color:#b9ada1;font-size:11px}.bar{height:7px;background:#39272b;margin-top:5px;border-radius:5px;overflow:hidden}.fill{height:100%;background:#c43d38;width:100%}#xp{background:#c9a34c}#bottom{position:fixed;bottom:12px;left:12px;background:#17141be8;border:1px solid #66564d;padding:8px;border-radius:6px;font-size:11px;color:#d3c5b5;pointer-events:none}#joy,#hit{display:none;position:fixed;bottom:70px;width:112px;height:112px;border-radius:50%;background:#ffffff17;border:1px solid #ffffff44;touch-action:none}#joy{left:18px}#nub{position:absolute;left:32px;top:32px;width:46px;height:46px;border-radius:50%;background:#c9b69b99;border:1px solid #eee}#hit{right:18px;width:84px;height:84px;bottom:82px;background:#782d2d77;border-color:#d18b68;display:none;place-items:center;font-size:30px}@media(pointer:coarse){#joy,#hit{display:block}#bottom{display:none}}#toast{position:fixed;top:24%;left:50%;transform:translateX(-50%);background:#20191bea;border:1px solid #b28a5e;padding:9px 14px;border-radius:6px;color:#f2d4a3;font-weight:bold;opacity:0;transition:opacity .2s}
</style></head><body><canvas id="c"></canvas><div id="hud"><div class="panel"><div class="brand">RIFTBOUND</div><b>Wanderer · <span id="lv">LV 1</span></b><div class="bar"><div id="hp" class="fill"></div></div><div class="muted" id="hpv">100 / 100</div><div class="bar"><div id="xp" class="fill" style="width:0%"></div></div><div class="muted">ASHEN DEPTHS</div></div><div class="panel" style="text-align:right"><div class="brand">DUNGEON RUN</div><b id="kills">Slain 0</b><div class="muted" id="gold">Gold 0</div></div></div><div id="bottom">WASD / arrows move · SPACE attack · Q heal</div><div id="joy"><div id="nub"></div></div><div id="hit">⚔</div><div id="toast"></div><script>
(()=>{const c=document.querySelector('#c'),g=c.getContext('2d');let W,H,dpr;function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}onresize=size;size();const T=44,C=39,R=31,WW=C*T,WH=R*T;let map=Array.from({length:R},(_,y)=>Array.from({length:C},(_,x)=>+(x===0||y===0||x===C-1||y===R-1||Math.random()<.045)));let p={x:WW/2,y:WH/2,h:100,m:100,lv:1,xp:0,need:70,gold:0,atk:0,dir:0},es=[],drops=[],kills=0,keys={},joy={x:0,y:0},shake=0;
function wall(x,y){let a=Math.floor(x/T),b=Math.floor(y/T);return a<0||b<0||a>=C||b>=R||map[b][a]}function move(o,x,y){if(!wall(o.x+x,o.y))o.x+=x;if(!wall(o.x,o.y+y))o.y+=y}function spawn(){for(let i=0;i<18;i++){let x=T*2+Math.random()*(WW-4*T),y=T*2+Math.random()*(WH-4*T);if(!wall(x,y)&&Math.hypot(x-p.x,y-p.y)>220)es.push({x,y,h:38,m:38,s:48+Math.random()*20,hit:0,cd:0})}}spawn();
function say(s){let t=document.querySelector('#toast');t.textContent=s;t.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>t.style.opacity=0,1200)}
function attack(){if(p.atk>0)return;p.atk=.3;let e=es.find(e=>Math.hypot(e.x-p.x,e.y-p.y)<76);if(e){e.h-=28;e.hit=.15;shake=5;if(e.h<=0){es=es.filter(a=>a!==e);kills++;p.xp+=20;p.gold+=4+Math.floor(Math.random()*7);if(Math.random()<.3)drops.push({x:e.x,y:e.y});if(p.xp>=p.need){p.xp-=p.need;p.lv++;p.need=Math.floor(p.need*1.4);p.m+=15;p.h=p.m;say('LEVEL UP!')}}}}
function heal(){if(p.h<p.m){p.h=Math.min(p.m,p.h+30);say('Healing light')}else say('Health is full')}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space'){e.preventDefault();attack()}if(e.key.toLowerCase()==='q')heal()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let last=performance.now();function update(dt){p.atk=Math.max(0,p.atk-dt);let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y,l=Math.hypot(x,y);if(l){x/=l;y/=l;p.dir=Math.atan2(y,x);move(p,x*175*dt,y*175*dt)}for(let e of es){e.cd=Math.max(0,e.cd-dt);e.hit=Math.max(0,e.hit-dt);let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);if(d<310&&d>28)move(e,dx/d*e.s*dt,dy/d*e.s*dt);else if(d<=30&&e.cd<=0){p.h-=7;e.cd=.85;shake=3;if(p.h<=0){p.h=p.m;p.x=WW/2;p.y=WH/2;say('You fell — returned to the rift')}}}drops=drops.filter(a=>{if(Math.hypot(a.x-p.x,a.y-p.y)<24){p.gold+=12;say('+12 gold');return false}return true});if(es.length<12&&Math.random()<dt*.12)spawnOne();document.querySelector('#hp').style.width=100*p.h/p.m+'%';document.querySelector('#hpv').textContent=Math.ceil(p.h)+' / '+p.m;document.querySelector('#xp').style.width=100*p.xp/p.need+'%';document.querySelector('#lv').textContent='LV '+p.lv;document.querySelector('#kills').textContent='Slain '+kills;document.querySelector('#gold').textContent='Gold '+p.gold}
function spawnOne(){let x=T+Math.random()*(WW-2*T),y=T+Math.random()*(WH-2*T);if(!wall(x,y)&&Math.hypot(x-p.x,y-p.y)>250)es.push({x,y,h:38,m:38,s:52,hit:0,cd:0})}
function draw(){let ox=Math.max(0,Math.min(WW-W,p.x-W/2)),oy=Math.max(0,Math.min(WH-H,p.y-H/2));g.save();g.translate(-ox+(Math.random()-.5)*shake,-oy+(Math.random()-.5)*shake);shake=Math.max(0,shake-.4);g.fillStyle='#17151a';g.fillRect(0,0,WW,WH);let ax=Math.floor(ox/T),ay=Math.floor(oy/T),bx=Math.ceil((ox+W)/T)+1,by=Math.ceil((oy+H)/T)+1;for(let y=ay;y<Math.min(R,by);y++)for(let x=ax;x<Math.min(C,bx);x++){let X=x*T,Y=y*T;if(map[y][x]){g.fillStyle='#302a30';g.fillRect(X,Y,T,T);g.fillStyle='#51464a';g.fillRect(X+2,Y+2,T-4,5);g.fillStyle='#211e24';g.fillRect(X+4,Y+9,T-8,T-13)}else{g.fillStyle=(x+y)%2?'#29262b':'#302b30';g.fillRect(X,Y,T,T);g.fillStyle='#484047';g.fillRect(X+(x*7+y*13)%34,Y+(y*11+x*5)%32,2,2)}}for(let d of drops){g.fillStyle='#d7b45e';g.fillRect(d.x-5,d.y-5,10,10)}for(let e of es){g.fillStyle='#100d10';g.beginPath();g.ellipse(e.x,e.y+10,14,6,0,0,7);g.fill();g.fillStyle=e.hit?'#fff':'#75615d';g.fillRect(e.x-9,e.y-13,18,24);g.fillStyle='#b94b3d';g.fillRect(e.x-6,e.y-7,3,3);g.fillRect(e.x+3,e.y-7,3,3);g.fillStyle='#54262a';g.fillRect(e.x-12,e.y-21,24,3);g.fillStyle='#c0443a';g.fillRect(e.x-12,e.y-21,24*Math.max(0,e.h/e.m),3)}g.fillStyle='#100d10';g.beginPath();g.ellipse(p.x,p.y+12,15,7,0,0,7);g.fill();g.save();g.translate(p.x,p.y);g.rotate(p.dir);g.fillStyle='#827467';g.fillRect(-10,-12,20,24);g.fillStyle='#c1a88c';g.fillRect(-7,-19,14,11);g.fillStyle='#302a30';g.fillRect(-6,-15,12,5);g.fillStyle='#d2c2a7';g.fillRect(6,-3,15,3);if(p.atk>0){g.strokeStyle='#f1d19a';g.lineWidth=4;g.beginPath();g.arc(0,0,38,-.9,.9);g.stroke()}g.restore();g.restore();let v=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.15,W/2,H/2,Math.max(W,H)*.7);v.addColorStop(0,'#0000');v.addColorStop(1,'#08070acc');g.fillStyle=v;g.fillRect(0,0,W,H)}
function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
const joyel=document.querySelector('#joy'),nub=document.querySelector('#nub');let jid=null;joyel.onpointerdown=e=>{jid=e.pointerId;joyel.setPointerCapture(jid);jmove(e)};joyel.onpointermove=e=>{if(e.pointerId===jid)jmove(e)};function jmove(e){let r=joyel.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),m=34;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.x=dx/m;joy.y=dy/m;nub.style.transform='translate('+dx+'px,'+dy+'px)'}function end(){jid=null;joy.x=joy.y=0;nub.style.transform=''}joyel.onpointerup=end;joyel.onpointercancel=end;document.querySelector('#hit').onpointerdown=e=>{e.preventDefault();attack()};})();
</script></body></html>
