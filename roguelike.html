(()=>{'use strict';
const c=document.querySelector('#c'),g=c.getContext('2d'),mini=document.querySelector('#mini'),mg=mini.getContext('2d');let W,H,D;function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
const S=42,MW=55,MH=43,worldW=MW*S,worldH=MH*S;let map=[],rooms=[],props=[],enemies=[],shots=[],drops=[],particles=[],keys={},joy={x:0,y:0},shake=0,clock=0,floor=1,kills=0,runGold=0,exit=null,boss=null;

function rnd(a,b){return a+Math.random()*(b-a)}function tile(x,y){let a=Math.floor(x/S),b=Math.floor(y/S);return b<0||a<0||b>=MH||a>=MW?1:map[b][a]}function blocked(x,y){return [[-9,-7],[9,-7],[-9,7],[9,7]].some(([dx,dy])=>tile(x+dx,y+dy)===1)}function move(o,dx,dy){if(!blocked(o.x+dx,o.y))o.x+=dx;if(!blocked(o.x,o.y+dy))o.y+=dy}
function makeDungeon(){map=Array.from({length:MH},()=>Array(MW).fill(1));rooms=[];props=[];enemies=[];shots=[];drops=[];particles=[];boss=null;exit=null;
for(let i=0;i<90&&rooms.length<10;i++){let w=Math.floor(rnd(5,10)),h=Math.floor(rnd(5,9)),x=Math.floor(rnd(2,MW-w-2)),y=Math.floor(rnd(2,MH-h-2));if(rooms.some(r=>x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y))continue;let room={x,y,w,h,cx:x+Math.floor(w/2),cy:y+Math.floor(h/2)};rooms.push(room);for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)map[yy][xx]=0;if(rooms.length>1){let a=rooms[rooms.length-2],b=room;if(Math.random()<.5){for(let xx=Math.min(a.cx,b.cx);xx<=Math.max(a.cx,b.cx);xx++)map[a.cy][xx]=0;for(let yy=Math.min(a.cy,b.cy);yy<=Math.max(a.cy,b.cy);yy++)map[yy][b.cx]=0}else{for(let yy=Math.min(a.cy,b.cy);yy<=Math.max(a.cy,b.cy);yy++)map[yy][a.cx]=0;for(let xx=Math.min(a.cx,b.cx);xx<=Math.max(a.cx,b.cx);xx++)map[b.cy][xx]=0}}}
if(rooms.length<3){for(let y=4;y< MH-4;y++)for(let x=4;x<MW-4;x++)if(x>5&&x<MW-6&&y>5&&y<MH-6)map[y][x]=0;rooms=[{cx:8,cy:8},{cx:MW-9,cy:MH-9},{cx:Math.floor(MW/2),cy:Math.floor(MH/2)}]}
let start=rooms[0],last=rooms[rooms.length-1];p.x=(start.cx+.5)*S;p.y=(start.cy+.5)*S;exit={x:(last.cx+.5)*S,y:(last.cy+.5)*S};

rooms.slice(1).forEach((r,i)=>{let count=2+Math.min(3,floor);for(let n=0;n<count;n++){let x=(r.x+r.w*.2+Math.random()*r.w*.6)*S,y=(r.y+r.h*.2+Math.random()*r.h*.6)*S;if(Math.hypot(x-p.x,y-p.y)>220)spawnEnemy(x,y,Math.random()<.22?'brute':Math.random()<.25?'cultist':'ghoul')}});if(floor%3===0){let r=rooms[rooms.length-1];boss={x:(r.cx+.5)*S,y:(r.cy+.5)*S,h:360+floor*55,m:360+floor*55,cd:1.2,hit:0};enemies=enemies.filter(e=>Math.hypot(e.x-boss.x,e.y-boss.y)>110)}}
function spawnEnemy(x,y,type){let spec=type==='brute'?[95,38,34,'#77605a']:type==='cultist'?[48,50,16,'#8d5a72']:[55,62,20,'#81796c'];enemies.push({x,y,h:spec[0]+floor*5,m:spec[0]+floor*5,s:spec[1],dmg:spec[2],col:spec[3],type,cd:rnd(.2,1),hit:0,phase:rnd(0,6)})}

function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=rnd(0,Math.PI*2),v=rnd(30,150);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.2,.55),max:.55,color})}}
function gainXP(n){p.xp+=n;if(p.xp>=p.need){p.xp-=p.need;p.lv++;p.need=Math.floor(p.need*1.38);p.m+=18;p.h=p.m;p.speed+=3;say('LEVEL UP · '+p.lv);burst(p.x,p.y,'#e8c878',22)}}

function cast(){if(p.cast>0)return;p.cast=.65;let a=p.dir;shots.push({x:p.x+Math.cos(a)*17,y:p.y+Math.sin(a)*17,vx:Math.cos(a)*410,vy:Math.sin(a)*410,life:.85,damage:34+p.lv*7});burst(p.x+Math.cos(a)*17,p.y+Math.sin(a)*17,'#9dc9ed',5)}

function potion(){if(p.potions<=0){say('No potions left');return}if(p.h>=p.m){say('Health is full');return}p.potions--;p.h=Math.min(p.m,p.h+55);say('Potion · +55 health');burst(p.x,p.y,'#d35a52',12)}

addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=1;if(e.code==='Space'){e.preventDefault();attack()}if(k==='e')cast();if(k==='q')potion();if(k==='shift')dodge()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let last=performance.now();function update(dt){clock+=dt;p.atk=Math.max(0,p.atk-dt);p.cast=Math.max(0,p.cast-dt);p.dash=Math.max(0,p.dash-dt);p.inv=Math.max(0,p.inv-dt);let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y,l=Math.hypot(x,y);if(l){x/=l;y/=l;p.dir=Math.atan2(y,x);let sp=p.speed*(p.dash>0?2.8:1);move(p,x*sp*dt,y*sp*dt)}

if(boss){boss.cd-=dt;boss.hit=Math.max(0,boss.hit-dt);let dx=p.x-boss.x,dy=p.y-boss.y,d=Math.hypot(dx,dy);if(d>58)move(boss,dx/d*42*dt,dy/d*42*dt);if(boss.cd<=0){let a=Math.atan2(dy,dx);for(let i=-1;i<=1;i++){let q=a+i*.24;shots.push({x:boss.x,y:boss.y,vx:Math.cos(q)*210,vy:Math.sin(q)*210,life:2,damage:17,hostile:true})}boss.cd=1.45}}
shots=shots.filter(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.life<=0||tile(s.x,s.y))return false;if(s.hostile){if(Math.hypot(s.x-p.x,s.y-p.y)<16){if(p.inv<=0)p.h-=s.damage;burst(s.x,s.y,'#cf665b',5);return false}}else{let e=enemies.find(e=>Math.hypot(s.x-e.x,s.y-e.y)<19);if(e){damageEnemy(e,s.damage);burst(s.x,s.y,'#9dc9ed',8);return false}if(boss&&Math.hypot(s.x-boss.x,s.y-boss.y)<34){boss.h-=s.damage;boss.hit=.1;return false}}return true});
drops=drops.filter(d=>{if(Math.hypot(d.x-p.x,d.y-p.y)<24){if(d.type==='gold'){runGold+=15;say('+15 gold')}else{p.potions++;say('Potion found')}return false}return true});
particles=particles.filter(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;a.vx*=.96;a.vy*=.96;return a.life>0});
if(p.h<=0){p.h=p.m*.55;p.x=rooms[0].cx*S;p.y=rooms[0].cy*S;shots=shots.filter(s=>!s.hostile);say('You fell · pulled back to the entrance')}

document.querySelector('#hp').style.width=100*p.h/p.m+'%';document.querySelector('#hpv').textContent=Math.ceil(p.h)+' / '+p.m;document.querySelector('#xp').style.width=100*p.xp/p.need+'%';document.querySelector('#lv').textContent='LV '+p.lv;document.querySelector('#kills').textContent='Slain '+kills;document.querySelector('#gold').textContent='Gold '+runGold;document.querySelector('#potions').textContent='Potions '+p.potions;document.querySelector('#stage').textContent='ASHEN DEPTHS · FLOOR '+floor;document.querySelector('#boss').style.display=boss?'block':'none';if(boss)document.querySelector('#bossfill').style.width=100*boss.h/boss.m+'%'}
function draw(){let ox=Math.max(0,Math.min(worldW-W,p.x-W/2)),oy=Math.max(0,Math.min(worldH-H,p.y-H/2));g.save();g.translate(-ox+(Math.random()-.5)*shake,-oy+(Math.random()-.5)*shake);shake=Math.max(0,shake-dtShake());g.fillStyle='#111015';g.fillRect(0,0,worldW,worldH);let ax=Math.max(0,Math.floor(ox/S)),ay=Math.max(0,Math.floor(oy/S)),bx=Math.min(MW,Math.ceil((ox+W)/S)+1),by=Math.min(MH,Math.ceil((oy+H)/S)+1);
for(let y=ay;y<by;y++)for(let x=ax;x<bx;x++){let X=x*S,Y=y*S;if(map[y][x]){g.fillStyle='#302a30';g.fillRect(X,Y,S,S);g.fillStyle='#51464a';g.fillRect(X+1,Y+1,S-2,6);g.fillStyle='#211e24';g.fillRect(X+3,Y+8,S-6,S-11);g.fillStyle='#65534d';g.fillRect(X+5,Y+18,12,2);g.fillRect(X+24,Y+29,14,2);g.fillStyle='#17151a';g.fillRect(X+19,Y+8,2,9)}else{g.fillStyle=(x+y)%2?'#29262b':'#302b30';g.fillRect(X,Y,S,S);g.fillStyle='#484047';g.fillRect(X+(x*7+y*13)%32,Y+(y*11+x*5)%31,2,2);if((x*17+y*11)%11===0){g.fillStyle='#51484a';g.fillRect(X+9+(x%3)*7,Y+31,6,2)}if((x*13+y*7)%19===0){g.fillStyle='#5a4c43';g.fillRect(X+31,Y+12,4,3)}}}
for(let y=3;y<MH-3;y+=5)for(let x=3;x<MW-3;x+=7)if(map[y][x]&&((x+y)%3===0)){let tx=x*S+S/2,ty=y*S+S/2;g.save();let glow=g.createRadialGradient(tx,ty,2,tx,ty,62);glow.addColorStop(0,'#e69a4c55');glow.addColorStop(1,'#e69a4c00');g.fillStyle=glow;g.fillRect(tx-62,ty-62,124,124);g.fillStyle='#574337';g.fillRect(tx-4,ty-9,8,18);g.fillStyle='#d18a42';g.beginPath();g.moveTo(tx,ty-18);g.quadraticCurveTo(tx+9,ty-8,tx,ty-3);g.quadraticCurveTo(tx-8,ty-9,tx,ty-18);g.fill();g.fillStyle='#ffe0a0';g.fillRect(tx-1,ty-13,2,7);g.restore()}
for(let q of props){if(Math.hypot(q.x-p.x,q.y-p.y)>Math.max(W,H))continue;g.fillStyle=q.type==='bones'?'#b3a18a':'#51484a';if(q.type==='bones'){g.fillRect(q.x-7,q.y-2,14,3);g.fillRect(q.x-5,q.y-6,4,4);g.fillRect(q.x+3,q.y+1,4,4)}else{g.beginPath();g.moveTo(q.x-7,q.y+5);g.lineTo(q.x-3,q.y-7);g.lineTo(q.x+7,q.y-3);g.lineTo(q.x+8,q.y+5);g.fill()}}
if(exit){g.save();g.translate(exit.x,exit.y);g.strokeStyle=boss?'#65566e':'#6f9c9b';g.lineWidth=4;g.beginPath();g.ellipse(0,0,19,29,0,0,Math.PI*2);g.stroke();g.strokeStyle='#c5a5db';g.globalAlpha=.5+Math.sin(clock*3)*.25;g.beginPath();g.ellipse(0,0,12,22,0,0,Math.PI*2);g.stroke();g.restore()}
